name: Build OrangeFox R12

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        default: vendorbootimage
        type: choice
        options:
          - vendorbootimage
          - bootimage
          - recoveryimage
      sync_branch:
        description: OrangeFox sync branch
        required: true
        default: "14.1"
      target_release:
        description: Android release config
        required: true
        default: ap2a
      jobs:
        description: Parallel build jobs
        required: true
        default: "4"
      maintainer:
        description: OrangeFox maintainer name
        required: false
        default: darkydtm
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

concurrency:
  group: orangefox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVICE: lemonadep
  TARGET_RELEASE: ${{ github.event.inputs.target_release || 'ap2a' }}
  OEM: oneplus
  FOX_SYNC_URL: https://gitlab.com/OrangeFox/sync.git
  DEFAULT_SYNC_BRANCH: "14.1"
  DEFAULT_TARGET: vendorbootimage
  ORANGEFOX_CONTAINER_IMAGE: ghcr.io/sushrut1101/docker:arch
  SM8350_REPOSITORY_URL: https://github.com/darkydtm/device_oneplus_sm8350-common-ofox.git
  SM8350_BRANCH: feat/r12-android-15-16

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lemonadep
        uses: actions/checkout@v4
        with:
          path: lemonadep

      - name: Checkout sm8350-common
        run: |
          git clone --depth=1 --branch "${SM8350_BRANCH}" "${SM8350_REPOSITORY_URL}" sm8350-common

      - name: Install static check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils

      - name: Validate lemonadep tree
        run: bash lemonadep/.github/scripts/validate-tree.sh lemonadep

      - name: Validate sm8350 XML
        run: |
          xmllint --noout sm8350-common/vintf/manifest.xml sm8350-common/vintf/manifest_odm.xml

      - name: Check committed whitespace
        run: |
          git -C lemonadep diff --check HEAD
          git -C sm8350-common diff --check HEAD

  build:
    name: Build ${{ github.event.inputs.target || 'vendorbootimage' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SYNC_BRANCH: ${{ github.event.inputs.sync_branch || '14.1' }}
      BUILD_TARGET: ${{ github.event.inputs.target || 'vendorbootimage' }}
      J_VAL: ${{ github.event.inputs.jobs || '4' }}
      OF_MAINTAINER: ${{ github.event.inputs.maintainer || 'darkydtm' }}
      FOX_BUILD_TYPE: Unofficial
      ALLOW_MISSING_DEPENDENCIES: "true"
      FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER: "1"
      LC_ALL: C
      USE_CCACHE: "0"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_SIZE: 0
    steps:
      - name: Checkout lemonadep
        uses: actions/checkout@v4
        with:
          path: trees/lemonadep

      - name: Checkout sm8350-common
        run: |
          git clone --depth=1 --branch "${SM8350_BRANCH}" "${SM8350_REPOSITORY_URL}" trees/sm8350-common

      - name: Prepare disk
        shell: bash
        run: |
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/lib/android \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            "${AGENT_TOOLSDIRECTORY:-}" || true
          docker system prune -af || true
          free -h
          df -h

      - name: Sync OrangeFox R12
        shell: bash
        run: |
          bash trees/lemonadep/.github/scripts/run-orangefox-container.sh '
            git clone --depth=1 "${FOX_SYNC_URL}" orangefox-sync
            rsync -a --delete orangefox-sync/patches/ patches/
            bash orangefox-sync/orangefox_sync.sh --branch "${SYNC_BRANCH}" --path "${GITHUB_WORKSPACE}/fox-r12"
            rm -rf orangefox-sync patches
            df -h
            du -sh fox-r12 trees 2>/dev/null || true
          '

      - name: Patch OrangeFox tree
        shell: bash
        run: bash trees/lemonadep/.github/scripts/run-orangefox-container.sh 'bash trees/lemonadep/.github/scripts/patch-orangefox-tree.sh fox-r12'

      - name: Place device trees
        shell: bash
        run: |
          bash trees/lemonadep/.github/scripts/run-orangefox-container.sh '
            mkdir -p fox-r12/device/oneplus
            rm -rf fox-r12/device/oneplus/lemonadep fox-r12/device/oneplus/sm8350-common
            rsync -a --delete --exclude=.git trees/lemonadep/ fox-r12/device/oneplus/lemonadep/
            rsync -a --delete --exclude=.git trees/sm8350-common/ fox-r12/device/oneplus/sm8350-common/
          '

      - name: Build OrangeFox
        shell: bash
        run: |
          bash trees/lemonadep/.github/scripts/run-orangefox-container.sh '
            df -h
            free -h
            du -sh fox-r12 fox-r12/out trees 2>/dev/null || true
            cd fox-r12
            source build/envsetup.sh
            lunch "twrp_${DEVICE}-${TARGET_RELEASE}-eng"
            mka -j"${J_VAL}" "${BUILD_TARGET}" 2>&1 | tee "${GITHUB_WORKSPACE}/orangefox-build.log"
          '

      - name: Collect artifacts
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          mkdir -p artifacts/diagnostics
          printf "run=%s\nsha=%s\n" "${GITHUB_RUN_ID}" "${GITHUB_SHA}" > artifacts/diagnostics/ci-context.txt
          {
            df -h
            free -h
            du -sh fox-r12 fox-r12/out trees artifacts 2>/dev/null || true
          } > artifacts/diagnostics/disk-usage.txt
          sudo dmesg -T | tail -200 > artifacts/diagnostics/dmesg-tail.txt 2>/dev/null || true
          product="fox-r12/out/target/product/${DEVICE}"
          {
            echo "product=${product}"
            find "${product}" -maxdepth 4 -type f -printf "%p\n" 2>/dev/null || true
            echo "out=${GITHUB_WORKSPACE}/fox-r12/out"
            find fox-r12/out -maxdepth 4 -type f \( -name "*.img" -o -name "*.zip" -o -name "*.log" -o -name "*.txt" \) -printf "%p\n" 2>/dev/null || true
          } > artifacts/diagnostics/output-files.txt
          find "${product}" -type f \( -name "*.img" -o -name "OrangeFox*.zip" \) -print -exec cp -a --no-preserve=ownership {} artifacts/ \; || true
          cp -a --no-preserve=ownership orangefox-build.log artifacts/ 2>/dev/null || true
          for file in \
            fox-r12/out/error.log \
            fox-r12/out/verbose.log \
            fox-r12/out/soong.log \
            fox-r12/out/.module_paths/Android.bp.list; do
            [[ -f "${file}" ]] && cp --parents -a --no-preserve=ownership "${file}" artifacts/diagnostics/
          done
          if [[ -d fox-r12/out/soong ]]; then
            find fox-r12/out/soong -maxdepth 2 -type f \( \
              -name "*.log" -o \
              -name "*.err" -o \
              -name "*.trace" -o \
              -name "*.variables" -o \
              -name "soong.environment.*" \
            \) -exec cp --parents -a --no-preserve=ownership {} artifacts/diagnostics/ \;
          fi
          test -n "$(find artifacts -maxdepth 1 -type f \( -name "*.img" -o -name "OrangeFox*.zip" \) -print -quit)"

      - name: Fix artifact permissions
        if: always()
        shell: bash
        run: |
          sudo chown -R "$(id -u):$(id -g)" artifacts 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-${{ env.DEVICE }}-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error

  summary:
    name: Result summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - static-checks
      - build
    steps:
      - name: Check job results
        run: |
          echo "static-checks=${{ needs.static-checks.result }}"
          echo "build=${{ needs.build.result }}"
          test "${{ needs.static-checks.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
